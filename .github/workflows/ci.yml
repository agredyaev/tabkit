name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PACKAGE_VERSION: "0.9.1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check package version
        run: python3 -c "import os,tomllib; v=tomllib.load(open('Cargo.toml','rb'))['package']['version']; assert v == os.environ['PACKAGE_VERSION'], (v, os.environ['PACKAGE_VERSION'])"
      - name: Check technical language
        run: python3 .github/check_language.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Validate web extension
        shell: bash
        run: |
          node --check extension/host.js
          node --check extension/vendor/tableau.extensions.1.17.0.min.js
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('extension/tabkit-web-dashboard.trex')"
          ! grep -R "tableau.extensions.1.latest.min.js" extension docs README.md

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --release --locked --all-targets

  artifacts:
    name: Artifacts (windows-x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked --bin tabkit-mcp --bin tabkit-extension-host

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path @("target/release/tabkit-mcp.exe","README.md","LICENSE") -DestinationPath "tabkit-mcp-v$env:PACKAGE_VERSION-windows-x64.zip"
          Compress-Archive -Path @("target/release/tabkit-extension-host.exe","README.md","LICENSE","docs/EXTENSION_DEPLOYMENT.md") -DestinationPath "tabkit-extension-host-v$env:PACKAGE_VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tabkit-mcp-v${{ env.PACKAGE_VERSION }}-windows-x64
          path: tabkit-mcp-v${{ env.PACKAGE_VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tabkit-extension-host-v${{ env.PACKAGE_VERSION }}-windows-x64
          path: tabkit-extension-host-v${{ env.PACKAGE_VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
