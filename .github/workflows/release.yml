name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - SECURITY.md
      - docs/**

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tabkit-windows-x64
          path: dist
      - if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/tabkit-windows-x64.zip --repo "$GITHUB_REPOSITORY"
