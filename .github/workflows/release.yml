name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_VERSION: "0.9.1"

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:PACKAGE_VERSION") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $env:PACKAGE_VERSION"
          }

      - run: cargo test --release --locked --all-targets
      - run: cargo build --release --locked --bin tabkit-mcp --bin tabkit-extension-host

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path @("target/release/tabkit-mcp.exe","README.md","LICENSE") -DestinationPath "tabkit-mcp-v$env:PACKAGE_VERSION-windows-x64.zip"
          Compress-Archive -Path @("target/release/tabkit-extension-host.exe","README.md","LICENSE","docs/EXTENSION_DEPLOYMENT.md") -DestinationPath "tabkit-extension-host-v$env:PACKAGE_VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-windows-x64
          path: |
            tabkit-mcp-v${{ env.PACKAGE_VERSION }}-windows-x64.zip
            tabkit-extension-host-v${{ env.PACKAGE_VERSION }}-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
