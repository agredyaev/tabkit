[package]
name = "tabkit"
version = "0.9.1"
default-run = "tabkit"
edition = "2024"
rust-version = "1.89"
description = "Headless Tableau 2026.2.4 workbook runtime and MCP server"
license = "MIT"
repository = "https://github.com/agredyaev/tabkit"
readme = "README.md"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
clap = { version = "4.6.8", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlparser = { version = "0.64.0", features = ["visitor"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1.29.3", features = ["v4"] }
xmlparser = "0.13.6"
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "tabkit-mcp"
path = "src/mcp_main.rs"

[[bin]]
name = "tabkit-extension-host"
path = "src/extension_host_main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
