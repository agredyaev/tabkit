[package]
name = "tabkit"
version = "0.9.0"
default-run = "tabkit"
edition = "2024"
rust-version = "1.88"
description = "Headless Tableau 2026.2.4 workbook runtime and MCP server"
license = "MIT"
repository = "https://github.com/agredyaev/tabkit"
readme = "README.md"
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rmcp = { version = "3.11", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlparser = { version = "=0.53.0", features = ["visitor"] }
tempfile = "3"
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1", features = ["v4"] }
xmlparser = "=0.13.6"
zip = { version = "=9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "tabkit-mcp"
path = "src/mcp_main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
